<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoMeet Controller</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 350px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      padding: 16px;
      user-select: none;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand img {
      width: 24px;
      height: 24px;
    }

    .brand-title {
      font-size: 15px;
      font-weight: 700;
      color: #38bdf8;
      letter-spacing: 0.2px;
    }

    .header-icons button {
      background: transparent;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      padding: 4px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .header-icons button:hover {
      color: #f8fafc;
      background: rgba(255, 255, 255, 0.1);
    }

    /* Cards */
    .card {
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .card-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #94a3b8;
      margin-bottom: 8px;
    }

    /* Room Card */
    .room-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #090d16;
      border: 1px solid #2563eb;
      border-radius: 8px;
      padding: 8px 12px;
      margin-bottom: 8px;
    }

    .room-name {
      font-size: 16px;
      font-weight: 700;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: #60a5fa;
    }

    .btn-copy {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #cbd5e1;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-copy:hover {
      background: rgba(255, 255, 255, 0.2);
      color: #ffffff;
    }

    .room-details {
      font-size: 11px;
      color: #94a3b8;
      line-height: 1.4;
      margin-bottom: 10px;
    }

    .btn-join {
      width: 100%;
      background: #2563eb;
      color: #ffffff;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.2s;
    }

    .btn-join:hover {
      background: #1d4ed8;
    }

    /* Schedule List */
    .schedule-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .schedule-item:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .schedule-info {
      display: flex;
      flex-direction: column;
    }

    .schedule-name {
      font-size: 12px;
      font-weight: 600;
      color: #e2e8f0;
    }

    .schedule-time {
      font-size: 11px;
      color: #38bdf8;
      font-family: monospace;
    }

    /* Switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 34px;
      height: 20px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #475569;
      transition: .3s;
      border-radius: 20px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: #3b82f6;
    }

    input:checked + .slider:before {
      transform: translateX(14px);
    }

    /* Status Bar */
    .status-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      background: #090d16;
      border-radius: 6px;
      padding: 8px 10px;
      margin-top: 8px;
    }

    .status-text {
      color: #94a3b8;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
    }

    .dot-rec {
      width: 7px;
      height: 7px;
      background: #ef4444;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }

    .dot-idle {
      width: 7px;
      height: 7px;
      background: #64748b;
      border-radius: 50%;
    }

    @keyframes pulse {
      0% { opacity: 0.4; }
      50% { opacity: 1; }
      100% { opacity: 0.4; }
    }

    /* Action Buttons */
    .actions-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 6px;
    }

    .btn-action {
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: opacity 0.2s;
    }

    .btn-record {
      background: #dc2626;
      color: #ffffff;
    }

    .btn-stop {
      background: #475569;
      color: #ffffff;
    }

    .btn-action:hover {
      opacity: 0.9;
    }

    /* Footer */
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      font-size: 11px;
      color: #64748b;
    }

    .footer a {
      color: #38bdf8;
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <div class="brand">
      <img src="../icons/icon-48.png" alt="Logo">
      <span class="brand-title">AutoMeet Jitsi</span>
    </div>
    <div class="header-icons">
      <button id="btn-open-options" title="Cài đặt">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </div>
  </div>

  <!-- Card 1: Phòng hôm nay -->
  <div class="card">
    <div class="card-title">Phòng họp hôm nay</div>
    <div class="room-box">
      <span class="room-name" id="popup-room-name">Staff...</span>
      <button class="btn-copy" id="btn-copy-room">Sao chép</button>
    </div>
    <div class="room-details" id="popup-room-details">
      Đang tải thông tin ngày...
    </div>
    <button class="btn-join" id="btn-join-meet">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
        <path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/>
      </svg>
      Vào phòng họp ngay
    </button>
  </div>

  <!-- Card 2: Lịch trình Record -->
  <div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
      <span class="card-title" style="margin-bottom: 0;">Lịch trình tự động</span>
      <label class="switch" title="Bật/Tắt chế độ tự động ghi hình theo lịch">
        <input type="checkbox" id="chk-master-auto-record">
        <span class="slider"></span>
      </label>
    </div>
    <div id="schedule-list">
      <!-- Được render động từ utils.js -->
    </div>
    <div class="status-box">
      <span class="status-text" id="popup-next-event">Đang kiểm tra...</span>
      <span class="status-badge" id="popup-active-badge">
        <span class="dot-idle"></span>
        <span id="popup-badge-label">Chờ</span>
      </span>
    </div>
  </div>

  <!-- Card 3: Thao tác thủ công -->
  <div class="card">
    <div class="card-title">Thao tác thủ công</div>
    <div class="actions-grid">
      <button class="btn-action btn-record" id="btn-manual-record">⏺ Bật Record</button>
      <button class="btn-action btn-stop" id="btn-manual-stop">⏹ Dừng Record</button>
    </div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <span>Phiên bản 1.0.0</span>
    <a href="#" id="link-options">Cài đặt nâng cao</a>
  </div>

  <script src="../utils.js"></script>
  <script src="popup.js"></script>
</body>
</html>
